* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
input[type=search], select { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
header.top { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-weight: 400; color: var(--muted); font-size: 12px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; transition: background .3s; }
.live-dot.on { background: var(--s-done); } .live-dot.flash { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
nav.tabs button { border: none; background: none; padding: 6px 10px; border-radius: 6px; color: var(--muted); }
nav.tabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.stats { display: flex; gap: 10px; padding: 8px 16px; overflow-x: auto; border-bottom: 1px solid var(--border); background: var(--surface2); flex-shrink: 0; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-width: 110px; box-shadow: var(--shadow); flex: 0 0 auto; max-width: 460px; }
.stat b { font-size: 18px; display: block; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.stat .pills { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11px; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
main { flex: 1; display: flex; min-height: 0; }
#view { flex: 1; min-width: 0; overflow: auto; position: relative; }
#view.canvas { overflow: hidden; }
aside.panel { width: 420px; max-width: 45vw; border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 16px; flex-shrink: 0; }
aside.panel.hidden { display: none; }
.panel h2 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.panel h3 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.panel .close { float: right; border: none; background: none; font-size: 18px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; }
.link-chip { display: inline-flex; gap: 4px; align-items: center; padding: 2px 8px; margin: 2px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); cursor: pointer; font-size: 12px; }
.link-chip:hover { border-color: var(--accent); }
.link-chip em { color: var(--faint); font-style: normal; font-size: 11px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kv div { background: var(--surface2); border-radius: 6px; padding: 4px 8px; }
.kv b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.kv span { font-size: 11px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; border: 1px solid var(--border); }
.bar > div { height: 100%; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 12px; }
.box { background: var(--surface2); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
.toolbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.legend { position: absolute; bottom: 10px; left: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; box-shadow: var(--shadow); max-width: calc(100% - 20px); z-index: 2; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
svg.graph { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
svg.graph.dragging { cursor: grabbing; }
.node { cursor: pointer; }
.node rect.card { fill: var(--surface); stroke-width: 2; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.12)); }
.node text { fill: var(--text); pointer-events: none; }
.node text.sub { fill: var(--muted); font-size: 10.5px; }
.node.sel rect.card { stroke-width: 4; }
.edge { fill: none; stroke: var(--edge); stroke-opacity: .42; }
.edge.planned { stroke: var(--s-proposed); stroke-dasharray: 6 5; stroke-opacity: .7; }
.edge.analyzer { stroke-dasharray: 2 4; }
.edge.cycle { stroke: var(--danger); stroke-opacity: .75; }
.focusing .node:not(.hl) { opacity: .16; }
.focusing .edge:not(.hl) { opacity: .05; }
.focusing .edge.hl-out { stroke: var(--out); stroke-opacity: .95; stroke-width: 2.2; }
.focusing .edge.hl-in { stroke: var(--in); stroke-opacity: .95; stroke-width: 2.2; }
.searching .node:not(.match) { opacity: .2; }
.mm-link { fill: none; stroke: var(--border); stroke-width: 1.5; }
.mm-group { font-weight: 700; }
/* board */
.board { display: flex; gap: 12px; padding: 16px; align-items: flex-start; min-width: max-content; }
.col { width: 270px; background: var(--surface2); border-radius: 10px; padding: 8px; border: 1px solid var(--border); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); border-left-width: 4px; }
.card:hover { border-color: var(--accent); }
.card .t { font-weight: 600; display: flex; gap: 6px; align-items: center; }

.card p { margin: 4px 0; color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 11px; color: var(--faint); }

/* lists and tables */
.page { padding: 16px; max-width: 1400px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.finding { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.finding .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.finding .h b { font-size: 14px; }
.finding pre { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; background: var(--surface2); border-radius: 6px; padding: 8px; margin: 8px 0; max-height: 260px; overflow: auto; }
.finding .rec { border-left: 3px solid var(--s-done); padding: 4px 10px; background: var(--surface2); border-radius: 0 6px 6px 0; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--surface2); position: sticky; top: 0; cursor: pointer; font-size: 12px; white-space: nowrap; z-index: 1; }
tr:hover td { background: var(--surface2); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; background: var(--surface2); border: 1px solid var(--border); margin: 1px; }
.tag.warn { color: var(--sev-medium); border-color: var(--sev-medium); }
.tag.bad { color: var(--sev-high); border-color: var(--sev-high); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); }
@media (max-width: 760px) {
  aside.panel { position: fixed; inset: auto 0 0 0; width: 100%; max-width: none; max-height: 65vh; border-left: none; border-top: 1px solid var(--border); z-index: 10; }
  .tools { margin-left: 0; width: 100%; }
}

ags":0,"lastDate":null,"lastWrite":"2026-09-03T20:19:20","components":["YFex.Search"]},{"path":"YFex/docs/internal/validation","file":"YFex/docs/internal/validation/README.md","title":"YFex.Validation & YFex.Rules — Design","status":"Status: approved design; Phases 0–4 implemented (Phase 3: 2026-09-29, D23–D28; Phase 4: 2026-09-30, D29–D38 — 4a engine, domain-agnostic refactor, 4b runtime editing incl. SQL store, audit, what-if, device cache) — progress and deviations in 13-phases-and-acceptance.md. Phase 6 B + C done (2026-09-30, \"Phase 6 implementation log\"): YFex.Rules.Dynamic (JSON rules with arithmetic + built-in/app/contract functions) and the AI schema export (validatable types,","files":14,"flags":2,"lastDate":"2026-09-30","lastWrite":"2026-10-15T15:12:46","components":["YFex.Rules","YFex.Validation"]},{"path":"YFex/docs/internal/web-tenancy-consolidation-plan.md","file":"YFex/docs/internal/web-tenancy-consolidation-plan.md","title":"YFex.Web ↔ YFex.Tenancy — Tenancy Consolidation Plan","status":"Status: Plan only — no code (2026-09-24). Supersedes §3 of","files":1,"flags":0,"lastDate":"2026-09-24","lastWrite":"2026-09-25T14:57:15","components":["YFex.Tenancy","YFex.Web"]},{"path":"YFex/docs/public/core.md","file":"YFex/docs/public/core.md","title":"Core Utilities","status":null,"files":1,"flags":0,"lastDate":null,"lastWrite":"2026-06-03T15:16:27","components":["YFex"]},{"path":"YFex/docs/public/cqrs.md","file":"YFex/docs/public/cqrs.md","title":"YFex.Cqrs","status":null,"files":1,"flags":0,"lastDate":null,"lastWrite":"2026-09-20T13:18:54","components":["YFex.Cqrs"]},{"path":"YFex/docs/public/messaging.md","file":"YFex/docs/public/messaging.md","title":"YFex.Messaging","status":null,"files":1,"flags":1,"lastDate":null,"lastWrite":"2026-10-19T16:00:06","components":["YFex.Messaging"]},{"path":"YFex/docs/public/navigatr.md","file":"YFex/docs/public/navigatr.md","title":"YFex.NavigatR","status":null,"files":1,"flags":0,"lastDate":null,"lastWrite":"2026-06-03T ience, YFex.Data and YFex.UI.Public — and all of those reference YFex core. There is no project-level cycle, but the repositories form a cycle, so they cannot be versioned, built or published as independent NuGet packages in any order. The auto findings 'Repository cycle' and 'Core repo depends on satellites' list every edge.","recommendation":"Treat the YFex repo as two things: the types-only core (leaf) and a set of framework components (Cqrs, Messaging, Rules, NavigatR, State, Persistence, Mvvm). Move the few contracts the framework needs (Permission, ActorIdentity, ScopeIdentity, ResilienceSpec) into core types (extends ⚑RA8), or move the framework components to their own repos. Then enforce 'core repo references nothing outside itself' with an architecture test.","source":"curated"},{"id":"F04","severity":"high","category":"duplication","status":"open","title":"Retry/backoff is implemented five times next to YFex.Resilience","components":["YFex.Resilience","YFex.Cqrs","YFex.Jobs","YFex.Web","YFex.Orchestration","YFex.Messaging"],"detail":"Resilience.RetryPolicy (Policies.cs) vs Cqrs RetryPolicy + RetryConfigurationBuilder (YFex.Cqrs/src/YFex.Cqrs/RetryPolicy.cs — Cqrs already references Resilience), Jobs RetryPolicy/RetryCalculator/[Retry], Jobs Hub ReconnectBackoff, Web.Refit RetryHandler/RetryOptions (+ its own docs/07-resilience.md), Orchestration RetryThenDeadLetterPolicy. Files and Notifications plan a sixth and seventh.","evidence":["YFex.Resilience/src/YFex.Resilience/Policies.cs","YFex.Cqrs/src/YFex.Cqrs/RetryPolicy.cs","YFex.Jobs/src/YFex.Jobs/Scheduling/RetryCalculator.cs","YFex.Web/src/Web/YFex.Web.Refit/Handlers/RetryHandler.cs","YFex.Orchestration/src/YFex.Orchestration.Rpc/Dlq/IDlqPolicy.cs"],"recommendation":"Resilience owns the vocabulary (retry spec, backoff + jitter calculator, classification of transient failures) as pure types; Cqrs/Jobs/Web/Orchestration map their configuration onto it. Write it into the Files and Notifications plans before they are built.","source":"curated"},{"id":"F05","severity":"medium","category":"duplication","status":"open","title":"Actor identity is defined three times","components":["YFex.Authorization","YFex.Audit","YFex.Messaging","YFex.Jobs","YFex.Logging","YFex"],"detail":"Authorization.Public ActorKind + ActorIdentity, Audit.Public AuditActorKind + AuditActor + ActorRelation, Messaging.Rpc CallIdentity; Logging enriches its own user strings. ⚑RA8 (2026-11-04) decided the actor types go to core; ⚑RA10 'one ActorKind numbering' is still open, and Jobs D2b is blocked on it.","evidence":["YFex.Authorization/src/YFex.Authorization.Public/Actor.cs","YFex.Audit/src/YFex.Audit.Public/AuditFacts.cs","YFex.Messaging/src/YFex.Messaging.Rpc/CallContext/CallContext.cs"],"recommendation":"Do RA8 next: one ActorIdentity, ActorKind and real-actor relation in core; Audit, Rpc CallIdentity, Logging and Jobs map to it. Unblocks Jobs D2b and Audit implicit entries.","source":"curated"},{"id":"F06","severity":"medium","category":"duplication","status":"open","title":"Logging and Audit still invent machine identity instead of using Installations","components":["YFex.Audit","YFex.Logging","YFex.Profiling","YFex.Installations"],"detail":"Audit AuditTrail.NodeId = Guid.CreateVersion7() per process (a new node on every restart) and DeviceId is a free string; Logging LoggingOptions.DeviceId string + InstanceId Guid; Profiling has its own hardware fingerprint. Installations (I0–I5 built) exists precisely to be the one answer to 'which machine' (installations README §1).","evidence":["YFex.Audit/src/YFex.Audit/AuditTrail.cs:13","YFex.Logging/src/YFex.Logging/Configuration/LoggingOptions.cs:58"],"recommendation":"Core contract 'current installation id' (types-only, already in YFex/src/YFex/Installations); Logging and Audit read it when present and fall back to a persisted id, never per-process.","source":"curated"},{"id":"F07","severity":"medium","category":"duplication","status":"open","title":"Three ways to send a message to a person","components":["YFex.Authentication","YFex.Logging","YFex.Jobs","YFex.Notifications"],"detail":"Authentication.Delivery (built: SMTP, HTTP e-mail, Twilio, Meta WhatsApp), Logging.Alerts (designed: own INotificationChannel/ISmsProvider), Jobs IJobNotifier (built, no-op). The Notifications plan addresses this but is still ⚑N1–N20 pending, while Authentication.Delivery keeps growing.","recommendation":"Approve Notifications before Logging Phase alerts and Jobs D2b; freeze new transports in Authentication.Delivery until it moves.","source":"curated"},{"id":"F08","severity":"medium","category":"duplication","status":"open","title":"Secret protection at rest has two contracts, one of them in the HTTP library","components":["YFex.Web","YFex.Cryptography","YFex.Jobs","YFex.Files","YFex.Notifications"],"detail":"YFex.Web owns ISecretProtector + SecretLocation (location-bound, per-tenant keys) and SealedSecretProtector in Web.Data; YFex.Cryptography owns ISecretStore (Jobs.Templates.Cryptography uses it). Binding a secret to tenant/table/row is generic and needed by Jobs, Files, Notifications and Authentication.","evidence":["YFex.Web/src/Web/YFex.Web/Credentials/ISecretProtector.cs","YFex.Web/src/Web/YFex.Web.Data/Security/SealedSecretProtector.cs","YFex.Cryptography/src/YFex.Cryptography/Secrets/SecretStores.cs"],"recommendation":"Move ISecretProtector/SecretLocation/SealedSecretProtector to Cryptography (or Cryptography.Data); Web.Data consumes it; delete the obsolete AesSecretProtector.","source":"curated"},{"id":"F09","severity":"medium","category":"opportunity","status":"open","title":"Outbox / inbox / journal / ledger re-implemented per library — candidate for one durable primitive","components":["YFex.Persistence","YFex.Messaging","YFex.Orchestration","YFex.EventSourcing","YFex.Offline","YFex.Cqrs","YFex.Audit","YFex.Notifications","YFex.Files"],"detail":"Built: Persistence IDurableQueue (deletes on dequeue, TTL, synchronous=NORMAL), Messaging.Rpc IOutbox/StorageBackedOutbox, Cqrs.Compensation ICommandJournal, Orchestration.Rpc IInbox, EventSourcing IEventInbox/KeyValueEventInbox, Offline ISiteJournal + IBrokerRequestLedger + IOfflineAllowanceLedger. Planned: Audit durable journal (⚑A13), Notifications outbox, Files Exchange ledger. Each has its own idempotency, retention and fsync policy.","recommendation":"New small design: durable append/claim/ack/dedupe primitives in Persistence (journal with idempotency key, retention policy, durability level) that the others compose. Do it before Audit A13, Notifications N-phases and Files F-phases start.","source":"curated"},{"id":"F10","severity":"low","category":"duplication","status":"open","title":"Three schedulers / durable timers","components":["YFex.Jobs","YFex.Orchestration","YFex.DataMining","YFex.Hosting"],"detail":"Jobs SchedulerHost, Orchestration ISagaScheduler + KeyValueDelayScheduler (durable waits), DataMining WormScheduler. Hosting plans 'Jobs inside the host'.","recommendation":"Decide in Hosting H0 whether Orchestration's durable waits run on the Jobs scheduler or a shared durable-timer contract (part of the F09 primitive).","source":"curated"},{"id":"F11","severity":"medium","category":"duplication","status":"open","title":"UI contracts exist twice (core YFex.UI.Abstractions vs YFex.UI.Public)","components":["YFex.UI","YFex.Mvvm"],"detail":"YFex/src/UI/YFex.UI.Abstractions defines IDialog, IMessageBox, INavigation, INotification, IToast, Types — the same interfaces as YFex.UI/src/Core/YFex.UI.Public. Nothing references the core copy. YFex.Mvvm sits in the core repo but references YFex.UI.Public in another repo.","evidence":["YFex/src/UI/YFex.UI.Abstractions","YFex.UI/src/Core/YFex.UI.Public"],"recommendation":"Delete the core copy; move YFex.Mvvm next to the UI components or keep it in core only if UI.Public moves to core.","source":"curated"},{"id":"F12","severity":"low","category":"consistency","status":"open","title":"Localization: core message catalogs vs Capabilities' own localizer vs Delivery templates","components":["YFex","YFex.Capabilities","YFex.Authentication","YFex.Validation","YFex.Notifications"],"detail":"Core has IMessageCatalog/MessageCatalog (Validation and the Notifications plan build on it). Capabilities defines ICapabilityLocalizer over Microsoft IStringLocalizer; Authentication.Delivery ships its own pt-BR/en/es templates.","recommendation":"Capabilities localizer as an adapter over IMessageCatalog; Delivery templates become catalog entries (moves with Notifications).","source":"curated"},{"id":"F16","severity":"low","category":"naming","status":"open","title":"Package naming conventions drift","components":["YFex.Jobs","YFex.Cqrs","YFex.NavigatR","YFex.Xml","YFex.Devices","YFex.DataMining","YFex.Privacy","YFex"],"detail":"Contracts: .Public (Audit, Authorization, Authentication, Search, UI) vs .Abstractions (Jobs, Jobs.Hub) vs core types. Generators: .Generator vs .SourceGenerator (Cqrs, NavigatR, Jobs, Xml) vs .Generators (Devices); test project YFex.CQRS.SourceGenerator.Tests (casing). DataMining connectors named YFex.Csv/Excel/MongoDb while engines are YFex.Data.Postgres. The Privacy repo holds only a generator (runtime types in core). Core type Percentual (Portuguese) among English names.","recommendation":"Pick .Public and .Generator ecosystem-wide; rename on the next breaking window; the atlas lists every project so the rename can be tracked.","source":"curated"},{"id":"F17","severity":"medium","category":"cross-platform","status":"open","title":"Platform coverage is uneven against the 'Windows/Linux/macOS' rule","components":["YFex.Cryptography","YFex.Installations","YFex.Time","YFex.Networking","YFex.System","YFex.Profiling","YFex.Security","YFex.Devices","YFex.Persistence"],"detail":"Only Cryptography has .Linux/.Apple (written, not run). Installations, Time, Networking, System, Profiling, Security, Devices have .Windows only; Persistence embeds Windows CNG in an OS-neutral package. The projects table shows the platform packages per component.","recommendation":"Track a platform matrix per component (the atlas 'Platforms' column) and run linuxKit on each library's tests as an acceptance gate.","source":"curated"},{"id":"F18","severity":"low","category":"consistency","status":"open","title":"Tenancy is optional for some libraries and hard-wired in others","components":["YFex.Tenancy","YFex.Cqrs","YFex.Persistence","YFex.Data","YFex.Audit","YFex.Logging","YFex.Orchestration","YFex.Jobs","YFex.Capabilities","YFex.Installations","YFex.NavigatR","YFex.Resilience","YFex.Messaging"],"detail":"Adapter packages: Cqrs.Tenancy, Persistence.Tenancy, Data.Tenancy. Direct references from the main package: Audit, Logging, Orchestration, Installations, Capabilities, Jobs.Abstractions, NavigatR, Messaging.Rpc, Resilience.Polly, Authorization, CustomLogic.","recommendation":"Move the ScopeIdentity value to core (like Installations/Time types). Tenancy keeps resolution and overrides; libraries need no adapter just to carry a scope.","source":"curated"},{"id":"F19","severity":"low","category":"duplication","status":"open","title":"Machine information is spread over System, Profiling, Security, Devices and Networking","components":["YFex.System","YFex.Profiling","YFex.Security","YFex.Devices","YFex.Networking"],"detail":"System NetworkSnapshot still exists next to Networking's snapshot (⚑N migration); Security.Windows references Profiling; YFex.System.Windows.Security lives in the core repo (YFex/src/System), not in YFex.System or YFex.Security.","evidence":["YFex.System/YFex.System/Data/NetworkSnapshot.cs","YFex/src/System/YFex.System.Windows.Security"],"recommendation":"Finish the Networking consumer migration for System; move YFex.System.Windows.Security to its repo; state System = machine facts, Devices = attached hardware, Profiling = behaviour, Security = inspection.","source":"curated"},{"id":"F20","severity":"low","category":"opportunity","status":"open","title":"~20 source generators copy their helper code","components":["YFex.Cqrs","YFex.State","YFex.Validation","YFex.Rules","YFex.Messaging","YFex.Jobs","YFex.Data","YFex.Audit","YFex.Privacy","YFex.Authorization","YFex.Capabilities","YFex.Logging"],"detail":"docs/internal/source-generators.md documents copy-paste of shared helpers (EquatableArray, diagnostics, writers) into every netstandard2.0 generator.","recommendation":"A source-only shared package (linked Compile items from one folder, or a contentFiles package) keeps generators self-contained without drifting copies.","source":"curated"},{"id":"F21","severity":"low","category":"consistency","status":"open","title":"Jobs' SQL store bypasses YFex.Data schema modules","components":["YFex.Jobs","YFex.Data"],"detail":"DS-P3 moved Offline, Authentication and Rules tables to portable YFex.Data schema modules; YFex.Jobs.Persistence.EntityFrameworkCore defines its tables only through EF.","recommendation":"Declare the Jobs tables as a YFex.Data SchemaModule (EF still works through ApplyYFexModule).","source":"curated"},{"id":"F22","severity":"medium","category":"gap","status":"open","title":"Every library ships hosted services, but there is no shared health/lifecycle contract yet","components":["YFex.Hosting","YFex.Offline","YFex.Installations","YFex.Messaging","YFex.Time","YFex.Networking","YFex.Jobs","YFex.Orchestration","YFex.Authorization"],"detail":"OutboxReplayer, ServerPermissionsFeed, Installations beacon/renewal, Offline connectivity/manifest/relay, SignedSnapshotRefresh, TimeSynchronizationService, NetworkConditionsMonitor, SchedulerHost… each reports status its own way. Hosting (status: proposed) is a prerequisite of Offline 4f.","recommendation":"Pull Hosting H0's module/health contract forward (types in core) so libraries report health the same way before more services are added.","source":"curated"},{"id":"F23","severity":"low","category":"docs","status":"open","title":"Design documents live in four places with two formats","components":["YFex.Jobs","YFex.Devices","YFex.Data","YFex.Web","YFex.Capabilities","YFex.EventSourcing","YFex.Orchestration"],"detail":"New designs: YFex/docs/internal/<topic>/ with phases + acceptance + log. Jobs keeps Plans A/A2/B/C/D in its repo root + .opencode/rules; Devices and Web in repo docs/; older flat *-design.md files have no phase log and stale status lines.","recommendation":"atlas.json is the single index: each component names its design home; move superseded flat docs to an archive folder.","source":"curated"},{"id":"F25","severity":"low","category":"layering","status":"open","title":"Bridge packages are placed on either side, which creates component cycles","components":["YFex.Authorization","YFex.Installations","YFex.Authentication","YFex.Offline","YFex.Search","YFex.Capabilities","YFex.Jobs"],"detail":"Authorization.Installations lives in Authorization (refs Installations) while Installations.Central refs Authorization.Public; Authentication.Offline lives in Authentication while Offline.Rules lives in Offline; Search.Capabilities, Capabilities.Cqrs, Jobs.Capabilities, Cqrs.Tenancy each pick a side.","recommendation":"Rule: a bridge A.B lives with the higher-level library of the pair and is named after it. The atlas flags any component cycle automatically.","source":"curated"},{"id":"F26","severity":"info","category":"consistency","status":"open","title":"Domain neutrality holds in infrastructure code","components":["YFex","YFex.Validation","YFex.Rules","YFex.Time","YFex.Cryptography","YFex.Offline","YFex.Logging"],"detail":"No CPF/CNPJ/SEFAZ/Farma in infrastructure code paths — only in XML-doc examples and tests. Watch: Money/Currency/Percentual in core (fine as types), Cryptography.Xml profiles named after NF-e/eSocial, Time 'Authority' source used for SEFAZ (lives in Fiscal), Offline 'pharmacy scenarios' doc (examples).","recommendation":"Keep domain profiles in product packages; the scanner can add a grep rule if this regresses.","source":"curated"},{"id":"F27","severity":"low","category":"opportunity","status":"open","title":"Per-scope configuration is about to be reinvented","components":["YFex.Tenancy","YFex.Web","YFex.Notifications","YFex.Hosting","YFex.Installer","YFex.Licensing","YFex.Installations"],"detail":"Tenancy scoped overrides, Web per-scope endpoints/credentials, Notifications per-scope providers/templates, Hosting module profiles per scope, Installer release targeting per scope, Licensing activation lists per scope. Distribution already converges on Installations signed bundles (good); the resolution side does not.","recommendation":"One 'scoped settings' resolution contract in Tenancy (tenant → site → installation chain), used by Web, Notifications, Hosting and Installer; bundles stay the transport.","source":"curated"},{"id":"AUTO-CYCLE-1","severity":"medium","category":"layering","status":"open","source":"auto","title":"Component cycle: YFex.Authorization ⇄ YFex.Cqrs ⇄ YFex.Installations ⇄ YFex.Messaging ⇄ YFex.Rules","detail":"These components reach each other through project references (no project-level cycle, but they cannot be released or reasoned about separately). Edges inside the cycle:\nYFex.Cqrs → YFex.Rules: YFex.Cqrs → YFex.Rules\nYFex.Cqrs → YFex.Authorization: YFex.Cqrs → YFex.Authorization.Public\nYFex.Cqrs → YFex.Authorization: YFex.Cqrs.Approvals → YFex.Authorization\nYFex.Cqrs → YFex.Messaging: YFex.Cqrs.Approvals → YFex.Messaging.Rpc\nYFex.Cqrs → YFex.Messaging: YFex.Cqrs.Approvals → YFex.Messaging.Rpc.Generator (analyzer)\nYFex.Messaging → YFex.Cqrs: YFex.Messaging.Rpc → YFex.Cqrs\nYFex.Messaging → YFex.Authorization: YFex.Messaging.Rpc → YFex.Authorization\nYFex.Rules → YFex.Authorization: YFex.Rules → YFex.Authorization.Public\nYFex.Rules → YFex.Authorization: YFex.Rules.Admin → YFex.Authorization.Generator (analyzer)\nYFex.Rules → YFex.Cqrs: YFex.Rules.Admin → YFex.Cqrs\nYFex.Rules → YFex.Cqrs: YFex.Rules.Admin → YFex.Cqrs.SourceGenerator (analyzer)\nYFex.Rules → YFex.Messaging: YFex.Rules.Admin → YFex.Messaging.Rpc\nYFex.Rules → YFex.Messaging: YFex.Rules.Admin → YFex.Messaging.Rpc.Generator (analyzer)\nYFex.Authorization → YFex.Installations: YFex.Authorization.Installations → YFex.Installations\nYFex.Authorization → YFex.Installations: YFex.Authorization.Installations.Central → YFex.Installations.Central\nYFex.Authorization → YFex.Installations: YFex.Authorization.Installations.Central → YFex.Installations.Rpc\nYFex.Authorization → YFex.Messaging: YFex.Authorization.Installations → YFex.Messaging.Rpc\nYFex.Installations → YFex.Authorization: YFex.Installations.Central → YFex.Authorization.Public\nYFex.Installations → YFex.Authorization: YFex.Installations.Central → YFex.Authorization.Generator (analyzer)\nYFex.Installations → YFex.Authorization: YFex.Installations.Rpc → YFex.Authorization.Public\nYFex.Installations → YFex.Messaging: YFex.Installations.Rpc → YFex.Messaging.Rpc","components":["YFex.Messaging","YFex.Installations","YFex.Authorization","YFex.Rules","YFex.Cqrs"],"recommendation":"Move the shared contract to core types or to the lower component's .Public, or move the bridge package to the higher-level side (F25)."},{"id":"AUTO-REPOCYCLE-1","severity":"high","category":"layering","status":"open","source":"auto","title":"Repository cycle across 10 repos","detail":"Repos YFex, YFex.Authorization, YFex.Cryptography, YFex.Data, YFex.Installations, YFex.Networking, YFex.Resilience, YFex.Tenancy, YFex.Time, YFex.UI reference each other, so none can be built, versioned or packaged on its own.\nYFex → YFex.Authorization (5): YFex.Cqrs → YFex.Authorization.Public; YFex.Cqrs.Approvals → YFex.Authorization; YFex.Messaging.Rpc → YFex.Authorization; YFex.NavigatR → YFex.Authorization.Public; …\nYFex → YFex.Resilience (2): YFex.Cqrs → YFex.Resilience; YFex.Messaging.Rpc → YFex.Resilience\nYFex → YFex.Tenancy (4): YFex.Cqrs.Tenancy → YFex.Tenancy; YFex.Messaging.Rpc → YFex.Tenancy; Y ing → YFex (2): YFex.Networking → YFex; YFex.Networking.Vendors → YFex\nYFex.Resilience → YFex.Tenancy (1): YFex.Resilience.Polly → YFex.Tenancy\nYFex.Tenancy → YFex (1): YFex.Tenancy → YFex\nYFex.Time → YFex (2): YFex.Time → YFex; YFex.Time.Persistence → YFex.Persistence\nYFex.Time → YFex.Cryptography (1): YFex.Time.Cryptography → YFex.Cryptography\nYFex.UI → YFex (2): YFex.Avalonia → YFex; YFex.Avalonia → YFex.Validation\nYFex.UI → YFex.Tenancy (1): YFex.Avalonia → YFex.Tenancy","components":["YFex.Cqrs","YFex.Authorization","YFex.Messaging","YFex.NavigatR","YFex.Rules","YFex.Resilience","YFex.Tenancy","YFex.Persistence","YFex.Cryptography","YFex.Time","YFex.UI","YFex.Mvvm","YFex.Data","YFex.Installations","YFex","YFex.Networking","YFex.Validation"],"recommendation":"See F01: keep the core repo a leaf; satellites depend on core, never the reverse."},{"id":"AUTO-CORE-OUT","severity":"high","category":"layering","status":"open","source":"auto","title":"Core repo depends on 7 satellite repos (18 references)","detail":"Library projects inside the YFex repo reference projects in sibling repos:\nYFex.Cqrs → YFex.Authorization.Public  [YFex.Authorization]\nYFex.Cqrs → YFex.Resilience  [YFex.Resilience]\nYFex.Cqrs.Approvals → YFex.Authorization  [YFex.Authorization]\nYFex.Cqrs.Tenancy → YFex.Tenancy  [YFex.Tenancy]\nYFex.Messaging.Rpc → YFex.Authorization  [YFex.Authorization]\nYFex.Messaging.Rpc → YFex.Resilience  [YFex.Resilience]\nYFex.Messaging.Rpc → YFex.Tenancy  [YFex.Tenancy]\nYFex.Messaging.Rpc → YFex.Cryptography  [YFex.Cryptography]\nYFex.Messaging.Rpc → YFex.Time  [YFex.Time]\nYFex.NavigatR → YFex.UI.Public  [YFex.UI]\nYFex.NavigatR → YFex.Authorization.Public  [YFex.Authorization]\nYFex.NavigatR → YFex.Tenancy  [YFex.Tenancy]\nYFex.Persistence.Encryption → YFex.Cryptography  [YFex.Cryptography]\nYFex.Persistence.Encryption → YFex.Cryptography.Windows  [YFex.Cryptography]\nYFex.Persistence.Tenancy → YFex.Tenancy  [YFex.Tenancy]\nYFex.Mvvm → YFex.UI.Public  [YFe // ─────────────────────────────────────────────────────────────── mind map (radial)

}
function card(c) {
  const sev = SEV.map(s => [s, c.findings.filter(f => f.severity === s).length]).filter(x => x[1]);
  return `<div class="card" data-id="${esc(c.id)}" style="border-left-color:${sColor(c.status)}">
    <div class="t">${esc(c.name)}<span class="g">${esc(groupName(c.group))}</span></div>
    ${c.progress != null ? `<div class="bar" style="margin:5px 0"><div style="width:${c.progress}%;background:${sColor(c.status)}"></div></div>` : ''}
    <p>${esc(c.summary || '')}</p>
    ${c.next ? `<p style="color:var(--text)"><b>Next:</b> ${esc(c.next)}</p>` : ''}
    <div class="meta">${sev.map(([s, n]) => `<span class="badge" style="background:${sevColor(s)}" title="${n} ${s} findings">${n}</span>`).join('')}
      ${c.metrics.projects ? `<span>${c.metrics.projects} proj · ${(c.metrics.lines / 1000).toFixed(1)}k loc</span>` : '<span>no code</span>'}
      ${c.dirty ? `<span class="tag warn">${c.dirty} uncommitted</span>` : ''}
      ${c.metrics.lastChange ? `<span>changed ${ago(c.metrics.lastChange)}</span>` : ''}</div></div>`;
}

// ─────────────────────────────────────────────────────────────── findings
function renderFindings(v) {
  const cats = [...new Set(FIND.map(f => f.category))].sort();
  const list = FIND.filter(f =>
    (!st.fSev.length || st.fSev.includes(f.severity)) && (!st.fCat || f.category === st.fCat) && (!st.fSrc || (f.source || 'curated') === st.fSrc) &&
    (!st.fStatus || (f.status || 'open') === st.fStatus) && (!st.fComp || (f.components || []).includes(st.fComp)) &&
    (!st.fText || (f.id + f.title + f.detail + (f.recommendation || '')).toLowerCase().includes(st.fText.toLowerCase())))
    .sort((a, b) => SEV.indexOf(a.severity) - SEV.indexOf(b.severity) || (a.source === b.source ? 0 : a.source === 'auto' ? 1 : -1) || a.id.localeCompare(b.id, undefined, { numeric: true }));
  v.innerHTML = `<div class="page">
    <div class="filters">
      ${SEV.map(s => `<button class="${st.fSev.includes(s) ? 'on' : ''}" onclick="fSev('${s}')"><i class="pill" style="background:${sevColor(s)};width:9px;height:9px;padding:0"></i> ${s} (${FIND.filter(f => f.severity === s && (f.status || 'open') === 'open').length})</button>`).join('')}
      <select onchange="st.fCat=this.value;save();render()"><option value="">All categories</option>${cats.map(c => `<option ${st.fCat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select onchange="st.fSrc=this.value;save();render()"><option value="">Curated + auto</option><option value="curated" ${st.fSrc === 'curated' ? 'selected' : ''}>Curated (analysis)</option><option value="auto" ${st.fSrc === 'auto' ? 'selected' : ''}>Auto (scanner)</option></select>
      <select onchange="st.fStatus=this.value;save();render()">${['open', 'accepted', 'fixed', 'wontfix', ''].map(s => `<option value="${s}" ${st.fStatus === s ? 'selected' : ''}>${s || 'any status'}</option>`).join('')}</select>
      <select onchange="st.fComp=this.value;save();render()"><option value="">All components</option>${D.components.filter(c => c.status !== 'domain').map(c => `<option value="${esc(c.id)}" ${st.fComp === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <input type="search" placeholder="Filter text…" value="${esc(st.fText)}" oninput="st.fText=this.value;clearTimeout(window._ft);window._ft=setTimeout(render,250)">
      <span class="muted">${list.length} shown</span>
    </div>
    ${list.map(f => `<div class="finding" style="border-left-color:${sevColor(f.severity)}">
      <div class="h"><span class="chip" style="background:${sevColor(f.severity)}">${f.severity}</span><b>${esc(f.id)} · ${esc(f.title)}</b>
        <span class="tag">${esc(f.category)}</span><span class="tag">${f.source === 'auto' ? 'auto' : 'curated'}</span>${(f.status || 'open') !== 'open' ? `<span class="tag">${esc(f.status)}</span>` : ''}</div>
      <div style="margin-top:4px">${(f.components || []).map(id => C.has(id) ? `<span class="link-chip" onclick="select('${esc(id)}')"><i class="pill" style="background:${sColor(C.get(id).status)};width:8px;height:8px;padding:0"></i>${esc(C.get(id).name)}</span>` : '').join('')}</div>
      <pre>${esc(f.detail)}</pre>
      ${(f.evidence || []).length ? `<details><summary>${f.evidence.length} evidence path(s)</summary>${f.evidence.map(p => `<div class="small"><a href="${fileUrl(p.replace(/:\d+$/, ''))}">${esc(p)}</a></div>`).join('')}</details>` : ''}
      ${f.recommendation ? `<div class="rec"><b>Recommendation.</b> ${esc(f.recommendation)}</div>` : ''}
    </div>`).join('') || '<div class="empty">No findings match.</div>'}</div>`;
}
function fSev(s) { st.fSev = st.fSev.includes(s) ? st.fSev.filter(x => x !== s) : [...st.fSev, s]; save(); render(); }

// ─────────────────────────────────────────────────────────────── projects
function renderProjects(v) {
  const kinds = [...new Set(D.projects.map(p => p.kind))].sort();
  const cols = [['name', 'Project'], ['component', 'Component'], ['repo', 'Repo'], ['kind', 'Kind'], ['tfms', 'Target'], ['aot', 'AOT'], ['refs', 'Refs out'], ['refsIn', 'Refs in'], ['csFiles', '.cs'], ['lines', 'Lines'], ['lastChange', 'Changed'], ['inSolution', 'In sln']];
  const val = (p, k) => k === 'refs' ? p.refs.length : k === 'tfms' ? p.tfms.join(';') : p[k];
  const list = D.projects.filter(p => (st.showDomain || C.get(p.component)?.status !== 'domain') && (!st.pKind || p.kind === st.pKind) &&
    (!st.pText || (p.name + ' ' + p.component + ' ' + p.path).toLowerCase().includes(st.pText.toLowerCase())))
    .sort((a, b) => { const x = val(a, st.pSort), y = val(b, st.pSort); return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * st.pDir; });
  v.innerHTML = `<div class="page"><div class="filters">
      <input type="search" placeholder="Filter projects…" value="${esc(st.pText)}" oninput="st.pText=this.value;clearTimeout(window._pt);window._pt=setTimeout(render,250)">
      <select onchange="st.pKind=this.value;save();render()"><option value="">All kinds</option>${kinds.map(k => `<option ${st.pKind === k ? 'selected' : ''}>${k}</option>`).join('')}</select>
      <button class="${st.showDomain ? 'on' : ''}" onclick="toggle('showDomain')">Domain repos</button>
      <span class="muted">${list.length} projects · click a header to sort · click a row for its component</span></div>
    <table><thead><tr>${cols.map(([k, t]) => `<th onclick="pSort('${k}')">${t}${st.pSort === k ? (st.pDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>
    ${list.map(p => `<tr data-c="${esc(p.component)}" style="cursor:pointer">
      <td><a href="${fileUrl(p.path)}" onclick="event.stopPropagation()" title="${esc(p.path)}">${esc(p.name)}</a></td>
      <td>${esc(C.get(p.component)?.name || p.component)}</td><td class="small muted">${esc(p.repo)}</td><td><span class="tag">${p.kind}</span></td>
      <td class="small">${esc(p.tfms.join('; '))}</td><td>${p.aot ? '✓' : ''}</td>
      <td class="num" title="${esc(p.refs.join('\n'))}">${p.refs.length}</td><td class="num">${p.refsIn}</td><td class="num">${p.csFiles}</td><td class="num">${p.lines.toLocaleString()}</td>
      <td class="small">${fmtDate(p.lastChange)}</td><td>${p.inSolution ? '✓' : '<span class="tag warn">no</span>'}</td></tr>`).join('')}
    </tbody></table></div>`;
  v.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => select(tr.dataset.c));
}
function pSort(k) { st.pDir = st.pSort === k ? -st.pDir : 1; st.pSort = k; save(); render(); }

// ─────────────────────────────────────────────────────────────── docs
function renderDocs(v) {
  const docs = [...D.docs].sort((a, b) => (b.lastDate || '').localeCompare(a.lastDate || ''));
  v.innerHTML = `<div class="page"><p class="muted">Design documents found under <code>YFex/docs/internal</code> plus the documents each component lists in <code>atlas.json</code>. “Last date” is the newest date mentioned in the document head; ⚑ counts decision flags in the README.</p>
    <table><thead><tr><th>Document</th><th>Components</th><th>Status line</th><th>Last date</th><th>Files</th><th>⚑</th></tr></thead><tbody>
    ${docs.map(d => `<tr><td><a href="${fileUrl(d.file)}">${esc(d.title)}</a><div class="small faint">${esc(d.path)}</div></td>
      <td>${(d.components || []).map(id => `<span class="link-chip" onclick="select('${esc(id)}')">${esc(C.get(id)?.name || id)}</span>`).join('') || '<span class="tag warn">unmapped</span>'}</td>
      <td class="small" style="max-width:560px">${esc((d.status || '—').slice(0, 320))}${(d.status || '').length > 320 ? '…' : ''}</td>
      <td class="small">${esc(d.lastDate || '—')}</td><td class="num">${d.files}</td><td class="num">${d.flags || ''}</td></tr>`).join('')}
    </tbody></table></div>`;
}

// ─────────────────────────────────────────────────────────────── activity
function renderActivity(v) {
  const repos = D.repos.filter(r => st.showDomain || !D.components.some(c => c.status === 'domain' && c.repos.includes(r.name) && c.id === r.name))
    .map(r => ({ ...r, act: [r.git.lastCommit, r.lastChange].filter(Boolean).sort().pop() }))
    .sort((a, b) => (b.act || '').localeCompare(a.act || ''));
  const maxDirty = Math.max(1, ...repos.map(r => r.git.dirty || 0));
  const recent = D.projects.filter(p => p.kind !== 'test' && (st.showDomain || C.get(p.component)?.status !== 'domain')).sort((a, b) => b.lastChange.localeCompare(a.lastChange)).slice(0, 30);
  v.innerHTML = `<div class="page">
    <h3 style="margin-top:0">Repositories by latest activity</h3>
    <table><thead><tr><th>Repo</th><th>Git</th><th>Last commit</th><th>Commits 14d</th><th>Uncommitted</th><th>Newest file change</th><th>Projects</th></tr></thead><tbody>
    ${repos.map(r => `<tr><td><b>${esc(r.name)}</b></td>
      <td>${r.git.isRepo ? esc(r.git.branch || '') : '<span class="tag bad">no git</span>'}</td>
      <td class="small">${r.git.lastCommit ? fmtDate(r.git.lastCommit) + ' · ' + esc((r.git.lastSubject || '').slice(0, 70)) : '—'}</td>
      <td class="num">${r.git.commits14d || 0}</td>
      <td><div style="display:flex;gap:6px;align-items:center"><div class="bar" style="width:120px"><div style="width:${100 * (r.git.dirty || 0) / maxDirty}%;background:var(--sev-medium)"></div></div><span class="small">${r.git.dirty || 0}</span></div></td>
      <td class="small">${fmtDate(r.lastChange)} <span class="faint">(${ago(r.lastChange)})</span></td><td class="num">${r.projects}</td></tr>`).join('')}
    </tbody></table>
    <h3>Most recently changed projects</h3>
    <table><thead><tr><th>Project</th><th>Component</th><th>Changed</th><th>Lines</th></tr></thead><tbody>
    ${recent.map(p => `<tr data-c="${esc(p.component)}" style="cursor:pointer"><td>${esc(p.name)}</td><td>${esc(C.get(p.component)?.name || p.component)}</td><td class="small">${fmtDate(p.lastChange, true)} <span class="faint">(${ago(p.lastChange)})</span></td><td class="num">${p.lines.toLocaleString()}</td></tr>`).join('')}
    </tbody></table></div>`;
  v.querySelectorAll('tbody tr[data-c]').forEach(tr => tr.onclick = () => select(tr.dataset.c));
}

// ─────────────────────────────────────────────────────────────── detail panel
function renderPanel() {
  const p = $('#panel'), c = st.selected && C.get(st.selected);
  if (!c) { p.classList.add('hidden'); return; }
  p.classList.remove('hidden');
  const shown = (e, id) => (!e.analyzerOnly || st.showAnalyzer) && (st.showDomain || C.get(id)?.status !== 'domain');
  const outs = (OUT.get(c.id) || []).filter(e => shown(e, e.to)), ins = (IN.get(c.id) || []).filter(e => shown(e, e.from));
  const chip = (id, e) => `<span class="link-chip" onclick="select('${esc(id)}')" title="${esc(e.planned ? 'planned: ' + (e.note || '') : (e.refs || []).join('\n'))}"><i class="pill" style="background:${sColor(C.get(id)?.status)};width:8px;height:8px;padding:0"></i>${esc(C.get(id)?.name || id)}${e.planned ? ' <em>planned</em>' : e.weight > 1 ? ` <em>×${e.weight}</em>` : ''}${e.cycle ? ' <em style="color:var(--danger)">cycle</em>' : ''}</span>`;
  const m = c.metrics, projs = D.projects.filter(x => x.component === c.id);
  p.innerHTML = `<button class="close" onclick="st.selected=null;st.focus='all';render()" aria-label="Close">×</button>
    <h2>${esc(c.name)}</h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="chip" style="background:${sColor(c.status)}">${STATUS[c.status] || c.status}</span><span class="tag">${esc(groupName(c.group))}</span><span class="small faint">${esc(c.id)}</span></div>
    ${c.progress != null ? `<div class="bar" style="margin-top:8px"><div style="width:${c.progress}%;background:${sColor(c.status)}"></div></div><div class="small muted">${c.progress}% by the curated estimate</div>` : ''}
    ${c.summary ? `<h3>What it does</h3><div>${esc(c.summary)}</div>` : '<div class="box small">Not described yet — add it to <code>atlas.json</code>.</div>'}
    ${c.next ? `<h3>Next</h3><div class="box">${esc(c.next)}</div>` : ''}
    ${(c.pending || []).length ? `<h3>Open decisions / gates</h3>${c.pending.map(x => `<span class="tag warn">${esc(x)}</span>`).join(' ')}` : ''}
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
      <button onclick="focusOn('deps')">Show what it needs</button><button onclick="focusOn('dependents')">Show who needs it</button><button onclick="focusOn('all')">Show all</button></div>
    <h3>Depends on (${outs.length})</h3>${outs.map(e => chip(e.to, e)).join('') || '<span class="faint">nothing outside itself</span>'}
    <h3>Used by (${ins.length})</h3>${ins.map(e => chip(e.from, e)).join('') || '<span class="faint">no one yet</span>'}
    ${c.findings.length ? `<h3>Open findings (${c.findings.length})</h3>${c.findings.sort((a, b) => SEV.indexOf(a.severity) - SEV.indexOf(b.severity)).map(f => `<div class="box small" style="cursor:pointer;border-left:3px solid ${sevColor(f.severity)}" onclick="st.fComp='${esc(c.id)}';st.fStatus='open';go('findings')"><b>${esc(f.id)}</b> ${esc(f.title)}</div>`).join('')}` : ''}
    ${m.projects ? `<h3>Code</h3><div class="kv">
      <div><b>${m.projects}</b><span>projects</span></div><div><b>${m.libraries}</b><span>libraries</span></div><div><b>${m.tests}</b><span>test projects</span></div>
      <div><b>${m.generators}</b><span>generators</span></div><div><b>${m.csFiles}</b><span>.cs files</span></div><div><b>${(m.lines / 1000).toFixed(1)}k</b><span>lines</span></div>
      <div><b>${m.aot}</b><span>AOT-marked</span></div><div><b>${(c.platforms || []).join(', ') || '—'}</b><span>platform pkgs</span></div><div><b>${ago(m.lastChange)}</b><span>last change</span></div></div>` : ''}
    ${(c.git || []).length ? `<h3>Git</h3>${c.git.map(g => `<div class="box small"><b>${esc(g.repo)}</b> ${g.isRepo ? `· ${esc(g.branch || '')} · last commit ${fmtDate(g.lastCommit)} (${ago(g.lastCommit)}) · ${g.commits14d} in 14 days<br><span class="muted">${esc(g.lastSubject || '')}</span>${g.dirty ? `<br><span class="tag warn">${g.dirty} uncommitted changes</span>` : ''}` : '<span class="tag bad">not a git repository</span>'}</div>`).join('')}` : ''}
    ${(c.docs || []).length ? `<h3>Design & docs</h3>${c.docs.map(d => d.missing ? `<div class="box small"><span class="tag bad">missing</span> ${esc(d.path)}</div>` : `<div class="box small"><a href="${fileUrl(d.file)}"><b>${esc(d.title)}</b></a> <span class="faint">${d.files} file(s)${d.lastDate ? ' · ' + d.lastDate : ''}${d.flags ? ' · ⚑' + d.flags : ''}</span>${d.status ? `<div class="muted" style="margin-top:4px">${esc(d.status.slice(0, 420))}${d.status.length > 420 ? '…' : ''}</div>` : ''}</div>`).join('')}` : ''}
    ${projs.length ? `<h3>Projects</h3><details ${projs.length <= 8 ? 'open' : ''}><summary>${projs.length} project(s)</summary>${projs.map(x => `<div class="small" style="padding:3px 0;border-bottom:1px solid var(--border)"><span class="tag">${x.kind}</span> <a href="${fileUrl(x.path)}">${esc(x.name)}</a> <span class="faint">${x.lines.toLocaleString()} lines · ${esc(x.tfms.join(';'))}</span>${x.refs.length ? `<div class="faint">→ ${esc(x.refs.join(', '))}</div>` : ''}</div>`).join('')}</details>` : ''}`;
}
function focusOn(f) { st.focus = f; save(); if (st.tab !== 'map') st.tab = 'map'; render(); }

// ─────────────────────────────────────────────────────────────── live reload (file:// friendly)
function poll() {
  if (!st.live || window.ATLAS_STANDALONE) return;
  const s = document.createElement('script');
  s.src = 'atlas.data.js?t=' + Date.now();
  s.onload = () => {
    s.remove();
    if (window.ATLAS_DATA && window.ATLAS_DATA.generatedAt !== D.generatedAt) {
      const v = $('#view'), top = v.scrollTop, left = v.scrollLeft, pTop = $('#panel').scrollTop;
      prep(); render();
      v.scrollTop = top; v.scrollLeft = left; $('#panel').scrollTop = pTop;
      const dot = $('#liveDot'); dot.classList.add('flash'); setTimeout(() => dot.classList.remove('flash'), 1200);
    }
  };
  s.onerror = () => s.remove();
  document.head.appendChild(s);
}

// ─────────────────────────────────────────────────────────────── boot
if (!window.ATLAS_DATA) {
  document.body.innerHTML = '<div class="empty"><h2>No data yet</h2><p>Run <code>yfexAtlas</code> (C:\\Dev\\Scripts\\Exe\\yfexAtlas.bat) to scan C:\\Dev\\YFex and create atlas.data.js next to this page.</p></div>';
} else {
  applyTheme(); prep(); liveDot(); render();
  if (window.ATLAS_STANDALONE) {
    // one-file snapshot: nothing to reload, and file:///C:/ links only exist on the scanning PC
    $('#live').parentElement.remove(); $('#liveDot').remove();
    $('#gen').textContent = 'snapshot ' + fmtDate(D.generatedAt, true) + ' · ' + D.machine;
  } else setInterval(poll, 4000);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
  addEventListener('keydown', e => { if (e.key === 'Escape') { st.selected = null; st.focus = 'all'; render(); } if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); } });
}
</script>
</body>
</html>
